name: Bug report
description: Something in the API is broken or unexpected
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: .NET 10, OS, SQL Server / Docker
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
